server {
    listen 8080 ssl http2;
    listen [::]:8080 ssl http2;
    server_name 124.221.155.102;
    client_max_body_size 8m;

    ssl_certificate /etc/math-model-gateway/tls/fullchain.pem;
    ssl_certificate_key /etc/math-model-gateway/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MathModelGatewayTLS:10m;
    ssl_session_timeout 1d;

    location = /agent {
        return 301 /agent/;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
